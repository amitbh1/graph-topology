# Local stack. Ports bind to 127.0.0.1 only — put a TLS-terminating reverse proxy in front for remote access.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medgraph-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-medgraph-local}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_db_transaction_timeout: 120s
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: medgraph-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    container_name: medgraph-api
    profiles: ["api"]            # docker compose --profile api up -d
    env_file: .env
    environment:
      MEDGRAPH_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}
    restart: unless-stopped

volumes:
  neo4j-data:
  ollama-data:
